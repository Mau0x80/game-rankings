name: Add Game from Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  add-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Parses the issue body and writes the new entry to
      # src/data/community-games.json. Runs entirely inside the Node.js
      # sandbox actions/github-script provides — the issue body (untrusted,
      # attacker-controlled text) is only ever read as a JS string here,
      # never interpolated into a shell command, so there's no
      # script-injection risk from a crafted submission.
      - name: Parse and validate issue
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Issue-form bodies are LF, but normalize defensively — a CRLF
            // body would silently fail every "### label\n\n" match below.
            const body = (context.payload.issue.body || '').replace(/\r\n/g, '\n');

            // This job runs on every new issue (not just ones from the
            // "Agregar un juego" template) — the `add-game` label the
            // template requests only gets attached if that label already
            // exists in the repo, which GitHub does not create for you, so
            // gating the job itself on `contains(issue.labels, 'add-game')`
            // silently no-ops until someone manually creates that label.
            // Detecting our form by its first field's heading instead has
            // no such prerequisite. Any issue that doesn't match is simply
            // not ours — return without commenting or failing.
            if (!body.includes('### Título del juego')) {
              return;
            }

            function extract(label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const re = new RegExp('### ' + escaped + '\\s*\\n\\n([\\s\\S]*?)(?=\\n### |$)');
              const m = body.match(re);
              if (!m) return '';
              const value = m[1].trim();
              return value === '_No response_' ? '' : value;
            }

            const title = extract('Título del juego');
            const platform = extract('Plataforma');
            const yearRaw = extract('Año de lanzamiento');
            const developer = extract('Desarrollador');
            const avgScoreRaw = extract('Score promedio (0-100)');
            const reviewsRaw = extract('Número de reseñas consideradas');
            const source = extract('Fuente (enlace a una reseña o página del juego)');

            // Keep in sync with PLATFORMS in src/constants.ts and the
            // dropdown options in .github/ISSUE_TEMPLATE/add-game.yml —
            // this is a closed, effectively-frozen list (the archive's own
            // historical platform codes), so the duplication is accepted
            // rather than adding a build step just to share it.
            const PLATFORMS = ['PC','MAC','PS','PS2','PS3','PS4','PSP','VITA','SNES','N64','GC','WII','WIIU','NS','GB','GBC','GBA','DS','3DS','XBOX','X360','XONE','GEN','SCD','SAT','DC','MOBI','NGE','IOS'];

            const year = Number(yearRaw);
            const avgScore = Number(avgScoreRaw);
            const reviews = Number(reviewsRaw);

            const errors = [];
            if (!title) errors.push('- Falta el título.');
            if (!PLATFORMS.includes(platform)) errors.push(`- Plataforma inválida: "${platform}".`);
            if (!Number.isInteger(year) || year < 1970 || year > 2100) errors.push(`- Año inválido: "${yearRaw}".`);
            if (!developer) errors.push('- Falta el desarrollador.');
            if (!Number.isFinite(avgScore) || avgScore < 0 || avgScore > 100) errors.push(`- Score inválido: "${avgScoreRaw}" (debe ser un número entre 0 y 100).`);
            if (!Number.isInteger(reviews) || reviews < 0) errors.push(`- Número de reseñas inválido: "${reviewsRaw}".`);
            if (source && !/^https?:\/\//.test(source)) errors.push(`- La fuente debe ser un enlace http(s), o dejarse vacía: "${source}".`);
            // Every field in the issue form is a single-line `input`, so a
            // real newline only reaches here via a hand-crafted API
            // submission bypassing the web form. Rejecting it closes two
            // problems at once. Second problem first, since it's simpler: a
            // bare newline (or "|") in a value rendered into the PR body's
            // markdown table would break out of its cell.
            //
            // First problem: a fake "### <other label>" embedded in one of
            // these fields could make extract() capture the wrong text for
            // that other field, since extract()'s search isn't anchored to
            // a line start. This alone doesn't require a newline in THIS
            // value — the fake heading's required trailing "\n\n" can be
            // satisfied by the field separator that already follows any
            // single-line field in a well-formed body. But no two free-text
            // fields (title/developer/source) are adjacent — platform,
            // year, avgScore, or reviews always sits between them — so a
            // successful hijack always swallows at least one more real
            // "### <label>\n\n" boundary before it can stop capturing. That
            // swallowed text either lands in title/developer/source (now
            // caught by this same newline check) or corrupts platform's
            // whitelist match / year's, avgScore's, or reviews' Number()
            // validation (caught there). So the two checks together close
            // this, even though neither one alone is doing it by rejecting
            // a raw newline in the hijacking field itself.
            for (const [name, value] of [['título', title], ['desarrollador', developer], ['fuente', source]]) {
              if (/[\r\n]/.test(value)) errors.push(`- El campo "${name}" no puede tener saltos de línea.`);
              if (value.includes('|')) errors.push(`- El campo "${name}" no puede contener "|".`);
            }

            if (errors.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: 'No pude procesar automáticamente esta propuesta:\n\n' + errors.join('\n') +
                  '\n\nEdita los datos de este issue (o abre uno nuevo) corrigiendo lo anterior.',
              });
              // Deliberately not core.setFailed(): an invalid submission is
              // user input, not a workflow bug — failing the run would
              // email the repo owner a "workflow failed" notice for every
              // stranger's typo.
              return;
            }

            // Same Bayesian-average formula the rest of the dataset uses —
            // m = 0.5, C = 67.56222559 (the dataset-wide mean rating).
            // Both constants come from the Sheet's own "Bayesian average
            // info" note and were confirmed by recomputing bayesianAvg for
            // several existing rows (Super Mario Galaxy, Super Metroid,
            // Grand Theft Auto V, Super Mario Odyssey) and matching the
            // sheet's stored value exactly.
            const M = 0.5;
            const C = 67.56222559;
            const avgScoreRounded = Math.round(avgScore * 100) / 100;
            const bayesianAvg = Math.round(((reviews / (reviews + M)) * avgScore + (M / (reviews + M)) * C) * 100) / 100;

            const communityPath = 'src/data/community-games.json';
            const community = fs.existsSync(communityPath)
              ? JSON.parse(fs.readFileSync(communityPath, 'utf8'))
              : [];

            // Negative, keyed to the issue number: guaranteed unique (issue
            // numbers never repeat in a repo) and distinguishable at a
            // glance from every archive id, which are all positive.
            community.push({
              id: -context.issue.number,
              t: title,
              p: platform,
              y: year,
              a: avgScoreRounded,
              r: reviews,
              d: developer,
              b: bayesianAvg,
            });

            // Pretty-printed (not a single minified line, unlike games.json)
            // so the PR this produces is actually reviewable — it's the
            // only thing standing between an attacker-supplied submission
            // and the live site.
            fs.writeFileSync(communityPath, JSON.stringify(community, null, 2) + '\n');

            core.setOutput('title', title);
            core.setOutput('platform', platform);
            core.setOutput('year', String(year));
            core.setOutput('developer', developer);
            core.setOutput('avgScore', String(avgScoreRounded));
            core.setOutput('reviews', String(reviews));
            core.setOutput('bayesianAvg', String(bayesianAvg));
            core.setOutput('source', source);

      - name: Open pull request
        if: success() && steps.parse.outputs.title != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GAME_TITLE: ${{ steps.parse.outputs.title }}
          GAME_PLATFORM: ${{ steps.parse.outputs.platform }}
          GAME_YEAR: ${{ steps.parse.outputs.year }}
          GAME_DEVELOPER: ${{ steps.parse.outputs.developer }}
          GAME_AVG_SCORE: ${{ steps.parse.outputs.avgScore }}
          GAME_REVIEWS: ${{ steps.parse.outputs.reviews }}
          GAME_BAYESIAN_AVG: ${{ steps.parse.outputs.bayesianAvg }}
          GAME_SOURCE: ${{ steps.parse.outputs.source }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="add-game/issue-${ISSUE_NUMBER}"
          git checkout -b "$BRANCH"
          git add src/data/community-games.json
          git commit -m "Add ${GAME_TITLE} (${GAME_PLATFORM}) from #${ISSUE_NUMBER}"
          git push origin "$BRANCH"

          # printf (not a heredoc) so every field is inserted as an opaque
          # %s argument, with no dependence on exact indentation/terminator
          # matching the way a heredoc inside an indented YAML block would need.
          PR_BODY="$(printf 'Generado automáticamente a partir de #%s.\n\n| Campo | Valor |\n|---|---|\n| Título | %s |\n| Plataforma | %s |\n| Año | %s |\n| Desarrollador | %s |\n| Score promedio | %s |\n| Reviews | %s |\n| Bayesian AVG (calculado) | %s |\n| Fuente | %s |\n\nRevisa los datos (y la fuente, si se dio una) antes de aprobar.\n' \
            "$ISSUE_NUMBER" "$GAME_TITLE" "$GAME_PLATFORM" "$GAME_YEAR" "$GAME_DEVELOPER" "$GAME_AVG_SCORE" "$GAME_REVIEWS" "$GAME_BAYESIAN_AVG" "${GAME_SOURCE:-(no proporcionada)}")"

          gh pr create \
            --title "Add game: ${GAME_TITLE}" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH"

          gh issue comment "$ISSUE_NUMBER" \
            --body "¡Gracias! Abrí un Pull Request con estos datos para que un mantenedor lo revise."
